<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>中国旅行 2026 🇨🇳</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🇨🇳 China Trip 2026</h1>
    <p>北京 × 西安 8/11〜8/17</p>
  </header>


  <main>

    <section class="hero">
      <h2>旅程</h2>
      <p id="trip-info">
        読み込み中...
      </p>
    </section>


    <section>
      <h2>📅 スケジュール</h2>

      <div id="schedule">
        読み込み中...
      </div>
    </section>


    <section class="menu">

      <button id="train-button">
        🚆 寝台列車
      </button>

      <button id="hotel-button">
        🏨 ホテル
      </button>

      <button id="reservation-button">
        🎫 予約情報
      </button>
      
      <button id="checklist-button">
        ✅ 持ち物チェック
      </button>

    </section>
    
<section id="reservation-section" class="hidden">

  <h2>🎫 予約情報</h2>

  <div id="reservation-card">
  </div>

</section>

<section id="train-section" class="hidden">

  <h2>🚆 寝台列車</h2>

  <div id="train-card">
  </div>

</section>

<section id="hotel-section" class="hidden">

  <h2>🏨 ホテル</h2>

  <div id="hotel-card">
  </div>

</section>

  </main>


  <footer>
    <p>Made for China Trip 2026</p>
  </footer>


<script src="app.js"></script>

</body>
</html>
