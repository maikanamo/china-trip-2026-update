name: Generate PNG icons

on:
  push:
    paths:
      - 'icon-512.svg'
      - '.github/workflows/generate-icons.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rasterizer (librsvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate PNG icons
        run: |
          # generate 512x512 and 192x192 from the SVG
          rsvg-convert -w 512 -h 512 icon-512.svg -o icon-512.png
          rsvg-convert -w 192 -h 192 icon-512.svg -o icon-192.png

      - name: Commit and push generated PNGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add icon-512.png icon-192.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate PNG icons from icon-512.svg"
            git push
          fi
